[package]
name = "textbench"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
repository.workspace = true
description = "Engine-neutral Q1-Q9 TextBench harness with parity and fallback gates."

[[bin]]
name = "textbench"
path = "src/bin/q1_q9.rs"

[[bin]]
name = "textbench-fixture-engine"
path = "src/bin/fixture_engine.rs"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
